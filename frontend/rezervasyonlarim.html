<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rezervasyonlarım · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body data-sayfa="rezervasyonlar">
  <header id="ust"></header>

  <main class="kapsayici">
    <div class="sayfa-baslik">
      <h1>Rezervasyonlarım</h1>
      <p>Son saat geçmemiş aktif rezervasyonlar iptal edilebilir, ücret iade edilir.</p>
    </div>

    <div class="sekmeler" id="sekmeler" role="group" aria-label="Duruma göre süz">
      <button type="button" data-durum="" aria-pressed="true">Tümü</button>
      <button type="button" data-durum="aktif" aria-pressed="false">Aktif</button>
      <button type="button" data-durum="kullanildi" aria-pressed="false">Kullanıldı</button>
      <button type="button" data-durum="iptal" aria-pressed="false">İptal</button>
    </div>

    <p id="bildirim" class="bildirim" hidden></p>
    <div id="liste" class="liste" aria-live="polite"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ortak.js"></script>
  <script src="/js/rezervasyonlarim.js"></script>
</body>
</html>
