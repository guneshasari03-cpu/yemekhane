<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
</head>
<body class="giris-sayfa" data-sayfa="giris">
  <main class="kapsayici">
    <section class="kart giris-kart">
      <div class="giris-logo" aria-hidden="true">Y</div>
      <h1>Yemekhane</h1>
      <p class="alt">Menü, rezervasyon ve bakiye işlemleri için giriş yapın.</p>

      <p id="bildirim" class="bildirim" hidden></p>

      <form id="giris-formu" novalidate>
        <div class="alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required
                 placeholder="ad.soyad@kampus.edu.tr">
        </div>
        <div class="alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="dugme dugme-tam" id="giris-dugme">Giriş yap</button>
      </form>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/ortak.js"></script>
  <script src="/js/giris.js"></script>
</body>
</html>
